[package]
name = "forcecoin"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17.14"
hex = "0.4"
rusqlite = { version = "0.34.0", features = ["bundled"] }
thiserror = "2.0.12"
rand = "0.9.0"
rayon = "1.10.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"

[[bin]]
name = "forcecoin"
path = "backend/blockchain/src/main.rs"
